# verl_android_adb_inference.yaml - Inference with ADB agent
#
# Same as verl_android_inference.yaml but agent_cls is AndroidADBAgent.
# Containers must expose POST /step_adb (build with docker/android/Dockerfile.adb
# as e.g. androidworld-adb:v8 and set env.docker_image to that image if needed).

agent_cls: skyrl_agent.agents.android.AndroidADBAgent

task: skyrl_agent.tasks.android.android_task.AndroidTask

tools:
  enable_android_env: true

data:
  instance_key: instance
  instance_id_key: instance.instance_id
  data_source_key: data_source
  max_pixels: 564480
  min_pixels: 78400

env:
  pool_size: 16
  buffer_size: 2
  docker_image: androidworld-adb:v8
  snapshot: clean
  sample_mode: sequential
  train_task_family: android_world
  val_task_family: android_world
  temp_path: /tmp/androidworld
  base_env_id: 0

generator:
  infer_backend: verl
  backend_config: null
  num_trajectories: 4
  max_iterations: 30
  max_prompt_length: 32768
  max_history_steps: 10
  training_strategy: early
  sampling_params:
    temperature: 0.7
    top_p: 0.95
    top_k: -1
    min_p: 0
    max_tokens: 4096
  val_config:
    num_trajectories: 1
    sampling_params:
      temperature: 0.7
      top_p: 0.95
      max_tokens: 4096
  remove_think_tokens: false
  vision_is_active: true
  qwen3_enable_thinking: false
  qwen3_acc_thinking: false

dispatcher:
  type: async_fix_pool
  max_parallel_agents: 16
  max_eval_parallel_agents: 16
  val_config:
    max_parallel_agents: 16
    max_eval_parallel_agents: 16
