# verl_android_inference_broker.yaml - Inference with broker-managed container pool (Mode B)
#
# Uses Qwen2-VL or similar vision-language model for UI automation tasks.
# Containers are managed by a persistent pool broker instead of created per-experiment.

agent_cls: skyrl_agent.agents.android.AndroidAgent

task: skyrl_agent.tasks.android.android_task.AndroidTask

tools:
  enable_android_env: true

data:
  instance_key: instance
  instance_id_key: instance.instance_id
  data_source_key: data_source
  # Vision processing config
  max_pixels: 564480
  min_pixels: 78400

# Environment configuration — Mode B (broker-managed container pool)
# The broker_url activates Mode B. Containers are acquired/returned per-task
# from the broker instead of being created locally.
env:
  broker_url: "http://localhost:9200"
  # These fields are ignored in Mode B (broker manages containers),
  # but kept for reference / fallback to Mode A (remove broker_url).
  pool_size: 8
  buffer_size: 2
  docker_image: androidworld:full_adb_agent
  use_host_network: true
  snapshot: clean
  sample_mode: sequential
  train_task_family: android_world
  val_task_family: android_world
  temp_path: /tmp/androidworld
  base_env_id: 0

generator:
  infer_backend: verl
  backend_config: null
  num_trajectories: 16
  max_iterations: 30
  max_prompt_length: 32768
  max_history_steps: 10  # Sliding window for inference context
  training_strategy: early  # "early" (stop on budget), "recent" (sliding window), "full" (error)
  sampling_params:
    temperature: 0.7
    top_p: 0.95
    top_k: -1
    min_p: 0
  val_config:
    num_trajectories: 1
    sampling_params:
      temperature: 0.7
      top_p: 0.95
  remove_think_tokens: false
  vision_is_active: true
  qwen3_enable_thinking: false
  qwen3_acc_thinking: false

dispatcher:
  type: async_fix_pool
  max_parallel_agents: 16
  max_eval_parallel_agents: 16
  val_config:
    max_parallel_agents: 8
    max_eval_parallel_agents: 8
