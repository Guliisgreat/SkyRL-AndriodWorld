# verl_android_2gpu.yaml - Memory-optimized config for 2x H100 GPU training
#
# Reduced from the base verl_android.yaml to fit within 2-GPU memory budget.

agent_cls: skyrl_agent.agents.android.AndroidAgent

task: skyrl_agent.tasks.android.android_task.AndroidTask

tools:
  enable_android_env: true

data:
  instance_key: instance
  instance_id_key: instance.instance_id
  data_source_key: data_source
  # Vision processing config
  max_pixels: 564480
  min_pixels: 78400

# Environment configuration for Docker containers
env:
  pool_size: 4
  buffer_size: 0
  docker_image: androidworld:full_adb_agent
  use_host_network: true
  snapshot: clean
  sample_mode: sequential
  train_task_family: android_world
  val_task_family: android_world
  temp_path: /tmp/androidworld
  base_env_id: 0

generator:
  infer_backend: verl
  backend_config: null
  num_trajectories: 4
  max_iterations: 30
  max_prompt_length: 8192
  max_history_steps: 3  # Reduced sliding window to fit 2-GPU memory
  training_strategy: early  # "early" (stop on budget), "recent" (sliding window), "full" (error)
  sampling_params:
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    min_p: 0
    max_tokens: 4096
  val_config:
    num_trajectories: 1
    sampling_params:
      temperature: 0.7
      top_p: 0.95
      max_tokens: 4096
  remove_think_tokens: false
  vision_is_active: true
  qwen3_enable_thinking: false
  qwen3_acc_thinking: false

dispatcher:
  type: async_fix_pool
  max_parallel_agents: 4
  max_eval_parallel_agents: 4
  val_config:
    max_parallel_agents: 4
    max_eval_parallel_agents: 4
