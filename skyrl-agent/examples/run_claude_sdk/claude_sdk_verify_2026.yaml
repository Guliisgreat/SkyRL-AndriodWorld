# Verification config for androidworld:2026 thin wrapper.
# Uses broker on port 9200 with 4 containers.

agent_cls: skyrl_agent.agents.android.claude_sdk_trajectory.ClaudeAgentSDK

task: skyrl_agent.tasks.android.android_task.AndroidTask

env:
  pool_size: 4
  broker_url: http://localhost:9200
  use_host_network: true
  snapshot: clean

claude_sdk:
  model: claude-sonnet-4-20250514
  max_turns: 30
  mode: mcp
  permission_mode: bypassPermissions

data:
  instance_key: instance
  instance_id_key: instance.instance_id
  data_source_key: data_source

results:
  save_trajectories: true
  save_screenshots: false
  trajectory_save_dir: ./results
