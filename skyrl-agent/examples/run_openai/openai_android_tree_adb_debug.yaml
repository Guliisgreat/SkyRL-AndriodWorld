# Debug config: 1 env, 1 instance, trajectory saving ON
# Usage: uv run ... --yaml examples/run_openai/openai_android_tree_adb_debug.yaml --max-instances 1

agent_cls: skyrl_agent.agents.android.AndroidAPITreeADBAgent

task: skyrl_agent.tasks.android.android_task.AndroidTask

tools:
  enable_android_env: true

data:
  instance_key: instance
  instance_id_key: instance.instance_id
  data_source_key: data_source
  max_pixels: 564480
  min_pixels: 78400

env:
  pool_size: 1
  buffer_size: 0
  docker_image: androidworld:full_adb_agent
  use_host_network: true
  snapshot: clean
  sample_mode: sequential
  train_task_family: android_world
  val_task_family: android_world
  temp_path: /tmp/androidworld
  base_env_id: 0

generator:
  infer_backend: openai_server
  backend_config:
    model_name: gpt-4o
    api_url: https://api.openai.com
    api_type: chat
    model_max_len: 32768
  num_trajectories: 1
  max_iterations: 30
  max_prompt_length: 32768
  max_history_steps: 10
  training_strategy: early
  sampling_params:
    temperature: 0.7
    top_p: 0.95
    max_tokens: 4096
  val_config:
    num_trajectories: 1
    sampling_params:
      temperature: 0.7
      top_p: 0.95
      max_tokens: 4096
  remove_think_tokens: false
  vision_is_active: false
  qwen3_enable_thinking: false
  qwen3_acc_thinking: false
  save_trajectories: true
  trajectory_save_dir: /tmp/trajectories
  trajectory_exp_name: full_adb_debug
  save_screenshots: true

trainer:
  logger: [console]
  project_name: skyrl-androidworld
  experiment_name: ""

dispatcher:
  type: async_fix_pool
  max_parallel_agents: 1
  max_eval_parallel_agents: 1
  val_config:
    max_parallel_agents: 1
    max_eval_parallel_agents: 1
