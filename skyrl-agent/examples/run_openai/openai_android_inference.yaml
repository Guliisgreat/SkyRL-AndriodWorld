# openai_android_inference.yaml - AndroidWorld evaluation via OpenAI-compatible API
#
# Uses any OpenAI-compatible endpoint (OpenAI, Azure, vLLM, SGLang) as the LLM backend.
# Set OPENAI_API_KEY env var before running.
#
# api_type options:
#   "chat"        - /v1/chat/completions (default, works with OpenAI/Azure/vLLM/SGLang)
#   "completions" - /v1/completions (raw token-id mode, vLLM/SGLang only)

agent_cls: skyrl_agent.agents.android.AndroidAgent

task: skyrl_agent.tasks.android.android_task.AndroidTask

tools:
  enable_android_env: true

data:
  instance_key: instance
  instance_id_key: instance.instance_id
  data_source_key: data_source
  max_pixels: 564480
  min_pixels: 78400

env:
  pool_size: 16
  buffer_size: 2
  docker_image: androidworld:full_adb_agent
  use_host_network: true
  snapshot: clean
  sample_mode: sequential
  train_task_family: android_world
  val_task_family: android_world
  temp_path: /tmp/androidworld
  base_env_id: 0

generator:
  infer_backend: openai_server
  backend_config:
    model_name: gpt-5-mini           # or any model name your API supports
    api_url: https://api.openai.com  # or http://localhost:8000 for local vLLM
    api_type: chat                   # "chat" or "completions"
    model_max_len: 32768
  num_trajectories: 16
  max_iterations: 30
  max_prompt_length: 32768
  max_history_steps: 10
  training_strategy: early
  sampling_params:
    temperature: 0.7
    top_p: 0.95
    max_tokens: 4096
  val_config:
    num_trajectories: 1
    sampling_params:
      temperature: 0.7
      top_p: 0.95
      max_tokens: 4096
  remove_think_tokens: false
  vision_is_active: true
  qwen3_enable_thinking: false
  qwen3_acc_thinking: false

dispatcher:
  type: async_fix_pool
  max_parallel_agents: 16
  max_eval_parallel_agents: 16
  val_config:
    max_parallel_agents: 16
    max_eval_parallel_agents: 16
