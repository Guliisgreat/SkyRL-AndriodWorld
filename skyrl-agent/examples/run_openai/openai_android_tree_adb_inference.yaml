# openai_android_tree_adb_inference.yaml - Text-only ADB agent via OpenAI-compatible API
#
# Uses AndroidAPITreeADBAgent (a11y tree text input, ADB command output) with any
# OpenAI-compatible endpoint. No screenshots -- pure text-in/text-out.
# Set OPENAI_API_KEY env var before running.

agent_cls: skyrl_agent.agents.android.AndroidAPITreeADBAgent

task: skyrl_agent.tasks.android.android_task.AndroidTask

tools:
  enable_android_env: true

data:
  instance_key: instance
  instance_id_key: instance.instance_id
  data_source_key: data_source
  max_pixels: 564480
  min_pixels: 78400

env:
  pool_size: 8
  buffer_size: 2
  docker_image: androidworld:full_adb_agent
  use_host_network: true
  skip_screenshot: true
  snapshot: clean
  sample_mode: sequential
  train_task_family: android_world
  val_task_family: android_world
  temp_path: /tmp/androidworld
  base_env_id: 200

generator:
  infer_backend: openai_server
  backend_config:
    model_name: gpt-5-mini
    api_url: https://api.openai.com
    api_type: chat
    model_max_len: 32768
  num_trajectories: 16
  max_iterations: 30
  max_prompt_length: 32768
  max_history_steps: 10
  training_strategy: early
  prompt_version: v6
  sampling_params:
    max_tokens: 4096
  val_config:
    num_trajectories: 1
    sampling_params:
      max_tokens: 4096
  remove_think_tokens: false
  vision_is_active: false
  qwen3_enable_thinking: false
  qwen3_acc_thinking: false
  save_trajectories: true
  trajectory_save_dir: ./results
  trajectory_exp_name: ""
  save_screenshots: true

trainer:
  logger: [console, wandb]
  project_name: skyrl-androidworld
  experiment_name: ""

dispatcher:
  type: async_fix_pool
  max_parallel_agents: 8
  max_eval_parallel_agents: 8
  val_config:
    max_parallel_agents: 8
    max_eval_parallel_agents: 8
