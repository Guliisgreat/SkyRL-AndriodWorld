# MobileUse agent: hierarchical multi-agent system (Planner + Operator + Reflector + ...)
# Uses Qwen2.5-VL-72B-Instruct as the backbone model.
# Based on https://github.com/MadeAgents/mobile-use (NeurIPS 2025, 75% on AndroidWorld)

agent_cls: skyrl_agent.agents.android.AndroidMobileUseAgent

task: skyrl_agent.tasks.android.android_task.AndroidTask

tools:
  enable_android_env: true

data:
  instance_key: instance
  instance_id_key: instance.instance_id
  data_source_key: data_source
  # Qwen2.5-VL pixel ranges for smart_resize
  max_pixels: 12845056    # 16384 * 28 * 28
  min_pixels: 3136        # 4 * 28 * 28

env:
  pool_size: 24
  buffer_size: 2
  docker_image: androidworld:full_adb_agent
  use_host_network: true
  snapshot: clean
  sample_mode: sequential
  train_task_family: android_world
  val_task_family: android_world
  temp_path: /tmp/androidworld_mobileuse
  base_env_id: 100

generator:
  infer_backend: openai_server
  backend_config:
    model_name: qwen2.5-vl-72b-instruct
    api_url: https://api.openai.com
    api_type: chat
    model_max_len: 32768
  num_trajectories: 1
  max_iterations: 30
  max_prompt_length: 32768
  max_history_steps: 10
  training_strategy: early
  sampling_params:
    temperature: 0.0
    max_tokens: 1024
  val_config:
    num_trajectories: 1
    sampling_params:
      temperature: 0.0
      max_tokens: 1024
  remove_think_tokens: false
  vision_is_active: true
  qwen3_enable_thinking: false
  qwen3_acc_thinking: false
  save_trajectories: false
  trajectory_save_dir: ./results
  trajectory_exp_name: ""
  save_screenshots: true

  # MobileUse-specific configuration
  mobileuse:
    # Sub-agent enable flags
    enable_planner: true
    enable_reflector: true
    enable_trajectory_reflector: true
    enable_global_reflector: true
    enable_progressor: true
    enable_answer_agent: true
    # Reflector parameters
    reflect_on_demand: false
    logprob_threshold: -0.01
    max_action_retry: 3
    # Trajectory reflector parameters
    traj_reflector_evoke_every: 5
    traj_reflector_cold_steps: 3
    max_repeat_action: 3
    max_repeat_screen: 3
    max_fail_count: 3
    # Global reflector
    max_finish_count: 3
    # Image sizing (Qwen2.5-VL)
    min_pixels: 3136
    max_pixels: 12845056
    # Pre-reflection optimization
    enable_pre_reflection: true

dispatcher:
  type: async_fix_pool
  max_parallel_agents: 24
  max_eval_parallel_agents: 24
  val_config:
    max_parallel_agents: 16
    max_eval_parallel_agents: 16
