# T3A-ADB agent with Qwen3-VL-30B-A3B-Instruct via local vLLM server (text-only mode)
# Same observation as T3A (UI element list + goal + history); ADB shell commands as action space.
# Uses vLLM OpenAI-compatible server on localhost:8234.

agent_cls: skyrl_agent.agents.android.AndroidT3AADBAgent

task: skyrl_agent.tasks.android.android_task.AndroidTask

tools:
  enable_android_env: true

data:
  instance_key: instance
  instance_id_key: instance.instance_id
  data_source_key: data_source
  max_pixels: 564480
  min_pixels: 78400

env:
  broker_url: "http://localhost:9200"
  pool_size: 16
  buffer_size: 1
  docker_image: androidworld:full_adb_agent
  use_host_network: true
  snapshot: clean
  sample_mode: sequential
  train_task_family: android_world
  val_task_family: android_world
  temp_path: /tmp/androidworld_t3a_adb_qwen3vl
  base_env_id: 0

generator:
  infer_backend: openai_server
  backend_config:
    model_name: Qwen/Qwen3-VL-30B-A3B-Instruct
    api_url: http://localhost:8234
    api_type: chat
    model_max_len: 32768
  num_trajectories: 1
  max_iterations: 30
  max_prompt_length: 32768
  max_history_steps: 10
  training_strategy: early
  sampling_params:
    max_tokens: 4096
    temperature: 0.6
  val_config:
    num_trajectories: 1
    sampling_params:
      max_tokens: 4096
      temperature: 0.6
  remove_think_tokens: true
  vision_is_active: false
  qwen3_enable_thinking: false
  qwen3_acc_thinking: false
  save_trajectories: true
  trajectory_save_dir: ./results
  trajectory_exp_name: ""
  save_screenshots: true

dispatcher:
  type: async_fix_pool
  max_parallel_agents: 16
  max_eval_parallel_agents: 16
  val_config:
    max_parallel_agents: 16
    max_eval_parallel_agents: 16
