# Claude Agent SDK baseline for AndroidWorld evaluation.
#
# The SDK's query() function replaces the entire agent loop.
# MCP tools bridge to the container infrastructure for ADB commands.

agent_cls: skyrl_agent.agents.android.claude_sdk_trajectory.ClaudeAgentSDK

task: skyrl_agent.tasks.android.android_task.AndroidTask

env:
  pool_size: 16
  buffer_size: 2
  docker_image: androidworld:full_adb_agent
  use_host_network: true
  snapshot: clean
  base_env_id: 0

claude_sdk:
  model: claude-sonnet-4-20250514
  max_turns: 30
  mode: bash  # "bash" (Bash tool + CLI wrapper) or "mcp" (custom MCP tools)
  permission_mode: bypassPermissions

data:
  instance_key: instance
  instance_id_key: instance.instance_id
  data_source_key: data_source

results:
  save_trajectories: true
  save_screenshots: true
  trajectory_save_dir: ./results
